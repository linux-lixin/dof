name: dnf-test
services:
  game:
    image: ${GAME_IMAGE:?Set GAME_IMAGE in .env}
    entrypoint: ["/bin/bash", "/opt/dnf-fixes/game-entrypoint.sh"]
    hostname: dnf-test-game
    restart: unless-stopped
    shm_size: 8g
    environment:
      TZ: Asia/Shanghai
      SERVER_GROUP: "3"
      SERVER_GROUP_DB: cain
      PUBLIC_IP: ${PUBLIC_IP:?Set your reachable server IPv4}
      OPEN_CHANNEL: "11,52"
      CLIENT_POOL_SIZE: "3"
      DNF_DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      DNF_DB_GAME_PASSWORD: ${GAME_DB_PASSWORD:?Set exactly 8 alphanumeric characters}
      WEB_USER: labadmin
      WEB_PASS: ${SUPERVISOR_PASSWORD:?Set SUPERVISOR_PASSWORD}
      GM_ACCOUNT: labgate
      GM_PASSWORD: ${GATE_PASSWORD:?Set GATE_PASSWORD}
    volumes:
      - ./fixes:/opt/dnf-fixes:ro
      - ./fixes/daily_job.sh:/home/template/init/daily_job/daily_job.sh:ro
      - ./fixes/response_time_tables.sh:/home/template/init/daily_job/response_time_tables.sh:ro
      - ./runtime/game/data:/data
      - ./runtime/game/mysql:/var/lib/mysql
      - ./runtime/game/log:/home/neople/game/log
    ports:
      - "0.0.0.0:7001:7001/tcp"
      - "0.0.0.0:7001:7001/udp"
      - "0.0.0.0:7300:7300/tcp"
      - "0.0.0.0:7300:7300/udp"
      - "0.0.0.0:30011:30011/tcp"
      - "0.0.0.0:31011:31011/udp"
      - "0.0.0.0:30052:30052/tcp"
      - "0.0.0.0:31052:31052/udp"
      - "0.0.0.0:2311-2313:2311-2313/udp"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -uroot -p"$${DNF_DB_ROOT_PASSWORD}" -N
          -e "SELECT 1 FROM d_taiwan.accounts LIMIT 1; SELECT 1 FROM taiwan_cain_2nd.member_avatar_coin LIMIT 1;"
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 60

  admin:
    image: ${ADMIN_IMAGE:?Set ADMIN_IMAGE in .env}
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    restart: "no"
    depends_on:
      game:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NGINX_PORT: "80"
      SERVER_PORT: "9001"
      SPRING_DATASOURCE_URL: "jdbc:mysql://game:3306/dnf_service?useUnicode=true&characterEncoding=utf8&useSSL=false&autoReconnect=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_INIT_SSL_MODE: "${MYSQL_INIT_SSL_MODE:-disabled}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.jdbc.Driver
    ports:
      - "0.0.0.0:18080:80/tcp"
    volumes:
      - ./fixes/admin-entrypoint.sh:/app/entrypoint.sh:ro
      - ./runtime/admin/data:/app/data

  files:
    image: nginx:stable-alpine
    profiles: [download]
    restart: unless-stopped
    ports:
      - "0.0.0.0:18081:80/tcp"
    volumes:
      - ./packages:/usr/share/nginx/html:ro

